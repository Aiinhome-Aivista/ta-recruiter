trigger:
  branches:
    include:
      - none

variables:
- group: adani-hiring
- name: IMAGE_TAG
  value: $(Build.BuildId)

resources:
  repositories:
    - repository: Recruiter_Angular_UI
      type: git
      name: ADANI_HIRING/Recruiter_Angular_UI
      ref: master

jobs:
- job: Build_And_Deploy
  pool: Default
  steps:

  - checkout: self

  - task: Bash@3
    displayName: Build_and_Push
    inputs:
      targetType: 'inline'
      script: |
        echo "Building and pushing Docker image"
        docker login acradani.azurecr.io -u $(acrforidauser) -p $(acrforidapassword)
        docker build -t acradani.azurecr.io/adani-recruiter-ui:$(Build.BuildId) .
        docker images
        docker push acradani.azurecr.io/adani-recruiter-ui:$(Build.BuildId)

  - task: replacetokens@5
    inputs:
      targetFiles: "./deployment.yaml"
      encoding: auto
      tokenPattern: custom
      tokenPrefix: "#__#"
      tokenSuffix: "#__#"
      writeBOM: true
      actionOnMissing: warn
      keepToken: false
      actionOnNoFiles: continue
      enableTransforms: false
      enableRecursion: false
      useLegacyPattern: false
      enableTelemetry: true

  - task: KubernetesManifest@0
    inputs:
      action: 'deploy'
      kubernetesServiceConnection: 'aks-adani-dev-001'
      namespace: 'adani-hiring'
      manifests: 'deployment.yaml'